x-airflow-common: &airflow-common
  build: .
  image: airflow-homework:3.3.1
  environment: &airflow-common-env
    PYTHONDONTWRITEBYTECODE: "1"
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    AIRFLOW__CORE__FERNET_KEY: "vRHkPqZ0i6VGTv0M0fXkQxUvEYtiJ0XQ2Nf4Fq8pPzE="
    AIRFLOW__API_AUTH__JWT_SECRET: "local-homework-jwt-secret"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://api-server:8080/execution/"
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "10"
    AIRFLOW__DAG_PROCESSOR__MIN_FILE_PROCESS_INTERVAL: "5"
    AIRFLOW__CORE__PARALLELISM: "8"
    AIRFLOW_CONN_WAREHOUSE: postgresql://etl:etl@warehouse:5432/warehouse
    AIRFLOW_CONN_SOURCE_API: '{"conn_type": "http", "host": "http://source-api:8000"}'
  volumes:
    - ./dags:/opt/airflow/dags
    - ./include:/opt/airflow/include
    - task-logs:/opt/airflow/logs
    - ./data:/opt/airflow/data:ro
    - ./tools:/opt/airflow/tools:ro
    - ./tests:/opt/airflow/tests
    - ./warehouse:/opt/airflow/warehouse:ro
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    airflow-db:
      condition: service_healthy

services:
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
    restart: "no"

  api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:${UI_PORT:-8090}:8080"
    healthcheck:
      test: ["CMD", "python", "/opt/airflow/include/health.py"]
      interval: 10s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  triggerer:
    <<: *airflow-common
    command: triggerer
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  source-api:
    image: python:3.12-slim
    command: python /app/server.py
    volumes:
      - ./source_api:/app:ro
      - ./data:/data:ro
    ports:
      - "127.0.0.1:${SOURCE_PORT:-8001}:8000"
    restart: unless-stopped

  warehouse:
    image: postgres:16
    environment:
      POSTGRES_USER: etl
      POSTGRES_PASSWORD: etl
      POSTGRES_DB: warehouse
    volumes:
      - warehouse-data:/var/lib/postgresql/data
      - ./warehouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "etl"]
      interval: 5s
      retries: 10

volumes:
  task-logs:
  airflow-db-data:
  warehouse-data:
